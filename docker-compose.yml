services:
  mytmux:
    build: .
    image: mytmux-prod:latest
    container_name: mytmux-prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mytmux.rule=Host(`mytmux.life`) || Host(`www.mytmux.life`)"
      - "traefik.http.routers.mytmux.entrypoints=web"
      - "traefik.http.services.mytmux.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
